<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chats</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; color: #111; }
  .app { display: flex; height: 100vh; }
  /* Sidebar, left, like WhatsApp Web */
  .sidebar { width: 340px; min-width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  .side-head { padding: 14px; display: flex; justify-content: space-between; align-items: center; background: #f0f2f5; font-weight: bold; }
  .side-head button { cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 10px; }
  .thread-list { overflow-y: auto; flex: 1; }
  .thread { width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eee; background: #fff; padding: 12px 14px; cursor: pointer; }
  .thread.active { background: #eef3ee; }
  /* Unread row: light green background + bold snippet, from your green idea */
  .thread.unread { background: #eaf7ea; }
  .thread.unread .snippet { font-weight: bold; color: #111; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .phone-mask { font-weight: bold; }
  .time { color: #667781; font-size: 12px; white-space: nowrap; }
  .row-bottom { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 4px; }
  .snippet { color: #667781; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Green dot with count, like WhatsApp */
  .badge { background: #25d366; color: #fff; border-radius: 50%; min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; padding: 0 4px; flex-shrink: 0; }
  /* Main pane, right */
  .main { flex: 1; display: flex; flex-direction: column; background: #efeae2; min-width: 0; }
  .main-head { background: #f0f2f5; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ddd; }
  .main-head .full-phone { font-weight: bold; font-size: 17px; }
  .copy-btn { cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 10px; }
  .back-btn { display: none; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 10px; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .date-sep { align-self: center; background: #fdf3c6; color: #54656f; font-size: 12px; padding: 5px 12px; border-radius: 8px; }
  .bubble { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
  .bubble .msg-time { display: block; text-align: right; font-size: 11px; color: #667781; margin-top: 4px; }
  .bubble.customer { align-self: flex-start; background: #fff; }
  .bubble.agent { align-self: flex-end; background: #d9fdd3; }
  .bubble.system { align-self: center; background: #fdf3c6; color: #54656f; font-size: 13px; text-align: center; }
  .empty { margin: auto; color: #667781; text-align: center; padding: 20px; }
  /* Phone: list first, tap a thread to open the chat, back arrow returns */
  @media (max-width: 700px) {
    .sidebar { width: 100%; }
    .main { display: none; }
    .app.show-chat .sidebar { display: none; }
    .app.show-chat .main { display: flex; }
    .back-btn { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar">
    <div class="side-head"><span>Chats</span><button id="refreshBtn">Refresh</button></div>
    <div class="thread-list" id="threadList"></div>
  </div>
  <div class="main">
    <div class="main-head" id="mainHead" style="display:none">
      <button class="back-btn" id="backBtn">← Back</button>
      <span class="full-phone" id="fullPhone"></span>
      <button class="copy-btn" id="copyBtn" title="Copy phone number">📋 Copy</button>
    </div>
    <div class="messages" id="messages"><div class="empty">No conversation selected yet.</div></div>
  </div>
</div>
<script>
  // No typing box in this version, on purpose. This page only reads.
  let currentPhone = null;
  let threadsCache = [];

  function maskPhone(phone) {
    // Sidebar shows only the last 4 digits, full number is in the header.
    if (!phone || phone.length <= 4) return phone || "";
    return "****" + phone.slice(-4);
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function timeOf(iso) {
    // Timestamps are stored in UTC. The browser shows them in local time.
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function dateOf(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString();
  }

  async function loadThreads() {
    const res = await fetch("/dashboard/api/threads");
    if (!res.ok) { document.getElementById("threadList").innerHTML = "<div class='empty'>Could not load chats. Check the dashboard password.</div>"; return; }
    threadsCache = await res.json();
    renderThreads();
    // Default open rule: most recent unread first, else most recent thread.
    // Threads are already sorted newest first by the server.
    if (!currentPhone && threadsCache.length > 0) {
      const firstUnread = threadsCache.find(t => t.unread_count > 0);
      openThread(firstUnread ? firstUnread.thread_id : threadsCache[0].thread_id);
    }
  }

  function renderThreads() {
    const list = document.getElementById("threadList");
    if (threadsCache.length === 0) {
      list.innerHTML = "<div class='empty'>No conversations yet.<br>Chats will appear here when a customer messages.</div>";
      return;
    }
    list.innerHTML = "";
    threadsCache.forEach(t => {
      // Fix for the open-thread bug: a thread that is already open
      // is being looked at, so it never gets the green dot or bold,
      // even if a new message just arrived in it.
      const isCurrent = t.thread_id === currentPhone;
      const hasUnread = t.unread_count > 0 && !isCurrent;
      const btn = document.createElement("button");
      btn.className = "thread" + (isCurrent ? " active" : "") + (hasUnread ? " unread" : "");
      btn.innerHTML =
        "<div class='row-top'><span class='phone-mask'>" + esc(maskPhone(t.thread_id)) + "</span>" +
        "<span class='time'>" + esc(timeOf(t.last_at)) + "</span></div>" +
        "<div class='row-bottom'><span class='snippet'>" + esc((t.last_direction === "agent" ? "You: " : "") + (t.last_text || "").slice(0, 80)) + "</span>" +
        (hasUnread ? "<span class='badge'>" + t.unread_count + "</span>" : "") + "</div>";
      btn.onclick = () => openThread(t.thread_id);
      list.appendChild(btn);
    });
  }

  async function openThread(phone) {
    currentPhone = phone;
    document.getElementById("app").classList.add("show-chat");
    document.getElementById("mainHead").style.display = "flex";
    document.getElementById("fullPhone").textContent = phone;
    document.getElementById("copyBtn").textContent = "📋 Copy";
    await loadMessages();
    // Owner opened it, so clear its green dot, then refresh the sidebar.
    await fetch("/dashboard/api/threads/" + encodeURIComponent(phone) + "/seen", { method: "POST" });
    await loadThreads();
    renderThreads();
  }

  async function loadMessages() {
    if (!currentPhone) return;
    const box = document.getElementById("messages");
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    const res = await fetch("/dashboard/api/threads/" + encodeURIComponent(currentPhone) + "/messages");
    if (!res.ok) return;
    const msgs = await res.json();
    if (msgs.length === 0) { box.innerHTML = "<div class='empty'>No messages in this thread yet.</div>"; return; }
    let html = "", lastDate = "";
    msgs.forEach(m => {
      const d = dateOf(m.created_at);
      if (d !== lastDate) { html += "<div class='date-sep'>" + esc(d) + "</div>"; lastDate = d; }
      html += "<div class='bubble " + esc(m.direction) + "'>" + esc(m.text) +
              "<span class='msg-time'>" + esc(timeOf(m.created_at)) + "</span></div>";
    });
    box.innerHTML = html;
    if (nearBottom) box.scrollTop = box.scrollHeight;
    // This thread is open, so what was just shown is seen.
    // Mark it seen on every refresh, not only when it was first
    // opened, otherwise a message that arrives while it is open
    // would stay unread on the server and get a dot on the next
    // sidebar refresh. No sidebar reload here, to avoid a loop:
    // the next 7-second refresh will pick up the cleared count.
    await fetch("/dashboard/api/threads/" + encodeURIComponent(currentPhone) + "/seen", { method: "POST" });
  }

  // Copy button: full number, no spaces, so pasting into WhatsApp search works.
  document.getElementById("copyBtn").onclick = async () => {
    const phone = currentPhone || "";
    const btn = document.getElementById("copyBtn");
    try {
      await navigator.clipboard.writeText(phone);
      btn.textContent = "✓ Copied";
    } catch (e) {
      // Clipboard needs HTTPS. Railway gives HTTPS. If it still fails,
      // select the number text so the owner can copy it manually.
      const range = document.createRange();
      range.selectNodeContents(document.getElementById("fullPhone"));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      btn.textContent = "Select + copy";
    }
    setTimeout(() => { btn.textContent = "📋 Copy"; }, 1500);
  };

  document.getElementById("refreshBtn").onclick = async () => { await loadThreads(); if (currentPhone) await loadMessages(); };
  document.getElementById("backBtn").onclick = () => { document.getElementById("app").classList.remove("show-chat"); };

  loadThreads();
  // Auto-refresh every 7 seconds. New messages appear without reloading
  // the page. A message that arrives while its thread is open is marked
  // seen by loadMessages, and its sidebar row never gets a dot.
  // A message in another thread gets a dot.
  setInterval(async () => {
    await loadThreads();
    if (currentPhone) await loadMessages();
  }, 7000);
</script>
</body>
</html>
